<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Relay Admin Panel</title>
  <link rel="stylesheet" href="/admin.css" />
  <script src="/admin.js" defer></script>
</head>
<body>

<h1>Relay Admin Panel</h1>

<label>
  API Key:
  <input id="apiKey" class="full-width" type="password" />
</label>

<hr>

<h3>Domains</h3>
<button id="refreshDomains" type="button">Refresh</button>
<table>
  <thead>
    <tr>
      <th>FQDN</th>
      <th>Status</th>
      <th>Device</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="domains"></tbody>
</table>

<hr>

<h3>Add domain</h3>
<input id="newDomain" class="full-width" placeholder="example.phone.local" />
<input id="ownerFingerprint" class="full-width spaced-input" placeholder="owner cert fingerprint (SHA-256)" />
<button id="addDomain" type="button">Add</button>

<p id="status" class="error"></p>

</body>
</html>
